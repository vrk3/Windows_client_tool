name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch: {}

jobs:
  test:
    # pywin32 / wmi / win32com are Windows-only, so this must run on a
    # Windows runner — the app and its dependencies don't work on Linux/macOS.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check (catches syntax errors across the whole tree)
        run: python -m compileall -q src

      - name: Import check (matches the documented dev-command in CLAUDE.md)
        run: python -c "import sys; sys.path.insert(0, 'src'); import main"

      - name: Run tests
        env:
          # No interactive desktop on the runner — Qt must use its offscreen platform.
          QT_QPA_PLATFORM: offscreen
        # No flags: they live in pyproject.toml's [tool.pytest.ini_options],
        # so this is exactly the command a developer runs locally. The two
        # had drifted — CI passed --timeout=120 while pytest-timeout was not
        # installed in the local venv, so "it passed for me" and "it passed
        # in CI" were answering different questions.
        # -n auto with --dist loadfile: several test modules hold
        # module-level state (the security catalog's shared SecurityControl
        # objects, ThemeManager's applied theme), so tests from one file
        # must stay in one worker. Plain --dist load splits them and fails.
        # 4083 tests: 2m57s serial, 29s here.
        run: python -m pytest -n auto --dist loadfile

      - name: Run the real-machine tests
        env:
          QT_QPA_PLATFORM: offscreen
        # These read the actual machine — WMI's service list, a real
        # `reg export`, live Qt font metrics — so they fail for
        # environmental reasons rather than code reasons, and a suite that
        # is normally red teaches everyone to ignore it. Run separately and
        # allowed to fail, so the signal stays visible without gating.
        continue-on-error: true
        run: python -m pytest -m real_machine

      - name: Coverage
        env:
          QT_QPA_PLATFORM: offscreen
        # Reported, not gated. Nobody has a baseline to hold yet, and a
        # threshold that fails on its first run teaches everyone to pass
        # --no-cov. Kept out of the default addopts because it roughly
        # doubles the wall clock of every local run.
        run: python -m pytest -n auto --dist loadfile --cov --cov-report=term

  package:
    # Catches packaging regressions the test job's import/compile checks
    # can't see — specifically the documented WinClientTool-portable.spec
    # pitfall (CLAUDE.md): if a.binaries/a.datas are ever dropped from the
    # EXE constructor, PyInstaller still "succeeds" but silently produces a
    # ~3MB bootloader stub instead of a working ~50MB onefile exe. Gated on
    # `test` passing first — no point spending several minutes building a
    # commit we already know is broken.
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build portable onefile package
        run: pyinstaller WinClientTool-portable.spec -y --distpath dist

      - name: Verify output is a real build, not a bootloader stub
        shell: pwsh
        run: |
          $exe = Get-Item "dist/WinClientTool-Portable.exe"
          Write-Host "WinClientTool-Portable.exe size: $($exe.Length) bytes"
          if ($exe.Length -lt 30MB) {
            Write-Error "EXE is suspiciously small (<30MB) — likely the bootloader-stub regression documented in CLAUDE.md (a.binaries/a.datas missing from the EXE constructor)."
            exit 1
          }
